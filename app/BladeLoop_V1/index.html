<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>BladeLoop — WinDECEE</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!--
      Responsive override.

      Unity's default template pins the canvas to a fixed 1600x900 - both in
      TemplateData/style.css (#unity-container.unity-desktop) and again as an
      inline style in the script below. On any window that is not exactly that
      size the app does not scale, it CLIPS: the left and right edges of the
      menu simply fall outside the viewport.

      This block comes after the template stylesheet and uses matching
      id+class specificity, and the inline sizing has been removed from the
      script, so the canvas now fills the window at any size. Unity's
      CanvasScaler (1920x1080, match 0.5) handles the UI from there.

      NOTE: a rebuild overwrites this file. To make it survive, copy it to
      Assets/WebGLTemplates/BladeLoop/index.html in the Unity project and pick
      that template in Player Settings > Web > Resolution and Presentation.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12100D;       /* BladeLoopTheme.Panel, so letterboxing matches the app */
      }

      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        transform: none !important;
        width: 100% !important;
        height: 100% !important;
      }

      #unity-canvas,
      #unity-canvas.unity-mobile {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #12100D;
      }

      /* Centre the loading bar rather than leaving it pinned to a 1600px box. */
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
      }

      /* Float the footer over the canvas instead of reserving a strip below it. */
      #unity-footer {
        position: fixed !important;
        right: 12px;
        bottom: 10px;
        width: auto !important;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        padding: 2px 8px;
      }
      #unity-build-title {
        color: #8A8177;
        font-family: system-ui, sans-serif;
        font-size: 12px;
      }
      #unity-logo-title-footer { display: none; }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translate(-50%, 0);
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">BladeLoop</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/BladeLoop_V1.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/BladeLoop_V1.data.unityweb",
        frameworkUrl: buildUrl + "/BladeLoop_V1.framework.js.unityweb",
        codeUrl: buildUrl + "/BladeLoop_V1.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "WinDECEE Group 4 OvGU",
        productName: "BladeLoop",
        productVersion: "0.5.0-demo",
        showBanner: unityShowBanner,
      };

      // Mobile gets the same full-bleed treatment; only the container class differs
      // so Unity's own mobile handling still applies.
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // The canvas render target follows its DOM size, which is now the window.
      // No inline width/height is set here - that is what pinned it to 1600x900
      // and made the app clip instead of scale.

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
